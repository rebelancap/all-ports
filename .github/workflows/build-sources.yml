name: Build SideStore sources

on:
  # Regenerate hourly so new app releases are picked up without any manual step.
  schedule:
    - cron: "17 * * * *"
  # Manual run button in the Actions tab.
  workflow_dispatch:
  # Let a port repo trigger an immediate rebuild the moment it publishes a release
  # (see README: "Instant refresh on release").
  repository_dispatch:
    types: [app-released]

permissions:
  contents: write               # to commit the regenerated JSON

concurrency:
  group: build-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # By name, not by github.sha: repository_dispatch pins the sha to whatever main
      # pointed at when the event was created, which can predate a commit an earlier
      # run has since pushed. Checking out the branch fetches the real head instead.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate source JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate.py

      # Losing a push race is not an error worth an email. Two runs still overlap despite
      # the concurrency group above — a release that fires both "published" and "edited"
      # dispatches the second before the first run has pushed, so the second starts from a
      # stale base and gets rejected. generate.py is deterministic, so replaying our output
      # onto whatever landed converges; usually it converges to "no changes at all".
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain apps-ios.json apps-visionos.json)" ]; then
              echo "No changes."
              exit 0
            fi
            git add apps-ios.json apps-visionos.json
            git commit -m "chore: refresh SideStore sources"
            if git push; then
              exit 0
            fi

            echo "push rejected (attempt $attempt of 3) — replaying onto the new head"
            # Deliberately not a rebase: both sides rewrote the same generated JSON, so a
            # rebase conflicts every time. Keep our files, drop our commit, start again on
            # the new head. Reset is safe because only these two files are ever generated.
            cp apps-ios.json apps-visionos.json "$RUNNER_TEMP/"
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/apps-ios.json" "$RUNNER_TEMP/apps-visionos.json" .
          done

          echo "::error::could not push after 3 attempts"
          exit 1

      # Publish first, complain second: a port with a broken release still leaves the
      # sources valid and up to date for every other app, but the run goes red so the
      # failure lands in your inbox instead of scrolling past in a log.
      - name: Fail if any declared platform was missing its IPA
        run: |
          if [ -s problems.txt ]; then
            echo "Sources were published, but:"
            cat problems.txt
            exit 1
          fi

      # ---- fan out to the per-family sources -------------------------------------
      # Nothing outside a repo can watch that repo's release events, so every app repo
      # dispatches HERE — one address they all already know. This step is the single
      # place that knows which OTHER sources exist, so adding or renaming one is a
      # one-line change here instead of an edit to a dozen app repos. (Before this
      # existed, quake-ports and harbourmasters-ports were never poked at all: they only
      # had their own cron, so a release could serve the PREVIOUS version to users for
      # nearly an hour while every workflow involved reported success. Found 2026-08-01
      # cutting q2repro 1.0.11.)
      #
      # Runs even if a step above failed — those sources regenerate independently of
      # whether this one changed — but not on the schedule trigger, since they have
      # their own cron for the quiet path.
      #
      # Needs a repo secret PORTS_FANOUT_DISPATCH: a fine-grained PAT with
      # Contents: read & write on rebelancap/quake-ports AND
      # rebelancap/harbourmasters-ports. Without it this step warns and succeeds.
      - name: Fan out to the per-family sources
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        env:
          TOKEN: ${{ secrets.PORTS_FANOUT_DISPATCH }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::PORTS_FANOUT_DISPATCH is not set — quake-ports and"
            echo "::warning::harbourmasters-ports will pick this release up on their own"
            echo "::warning::cron instead (up to 10 min lag). To wire it up: create a"
            echo "::warning::fine-grained PAT with Contents: read & write on both, then"
            echo "::warning::gh secret set PORTS_FANOUT_DISPATCH --repo rebelancap/all-ports"
            exit 0
          fi
          rc=0
          for repo in rebelancap/quake-ports rebelancap/harbourmasters-ports; do
            if curl -fsS -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer $TOKEN" \
                 "https://api.github.com/repos/$repo/dispatches" \
                 -d '{"event_type":"app-released"}'; then
              echo "dispatched app-released -> $repo"
            else
              echo "::error::Dispatch to $repo FAILED (token present but rejected — check"
              echo "::error::that its repository access includes $repo, Contents: read &"
              echo "::error::write). Users keep seeing the previous version until that"
              echo "::error::source's cron runs. Manual fix:"
              echo "::error::  gh workflow run build-sources.yml --repo $repo"
              rc=1
            fi
          done
          exit $rc
